services:
  # MySQL 服务
  mysql:
    image: mysql:8.0
    deploy:
      placement:
        constraints: ["node.hostname == ${DOC_AI_MANAGER_HOST}"]
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nacos_config
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --max-connections=500
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-schema.sql:/docker-entrypoint-initdb.d/01-nacos-schema.sql:ro
    networks:
      - docai-network

  # Redis 集群
  redis:
    image: redis:7.0
    deploy:
      mode: replicated
      replicas: 2
      placement:
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - docai-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.8-management
    deploy:
      placement:
        constraints: ["node.hostname == ${DOC_AI_NODE1_HOST}"]
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - docai-network

  # MinIO
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    deploy:
      placement:
        constraints: ["node.hostname == ${DOC_AI_NODE1_HOST}"]
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - docai-network

  # Nacos
  nacos:
    image: nacos/nacos-server:v2.2.0
    deploy:
      placement:
        constraints: ["node.hostname == ${DOC_AI_NODE3_HOST}"]
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: ${MYSQL_USERNAME}
      MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - docai-network

networks:
  docai-network:
    external: true

volumes:
  mysql-data:
  redis-data:
  minio-data:
  nacos-data:
