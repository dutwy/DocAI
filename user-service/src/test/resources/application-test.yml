spring:
  datasource:
    url: jdbc:h2:mem:user_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  data:
    redis:
      repositories:
        enabled: false

security:
  jwt:
    secret: test-only-jwt-secret-that-is-at-least-thirty-two-bytes

logging:
  level:
    root: warn

