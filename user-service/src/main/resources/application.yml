spring:
  config:
    import: optional:classpath:application-observability.yml
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: user
  
  # 数据库配置
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:infra_mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:doc_ai}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 300000
      connection-timeout: 10000
  
  # 禁用 Spring Cloud 兼容性检查
  cloud:
    compatibility-verifier:
      enabled: false
    # Nacos 服务注册发现配置
    nacos:
      discovery:
        server-addr: nacos:8848
        namespace: public
        timeout: 30000
      client:
        namespace: public
        timeout: 30000

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:infra_redis}
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 10000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.javaee.user.entity
  configuration:
    map-underscore-to-camel-case: true

# 服务器配置
server:
  port: 8081
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    context-path: /

# 日志配置
logging:
  level:
    com.javaee.user: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: info

security:
  jwt:
    secret: ${JWT_SECRET:}
    previous-secret: ${JWT_PREVIOUS_SECRET:}
    issuer: doc-ai
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 604800000
