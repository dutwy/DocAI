spring:
  datasource:
    url: jdbc:h2:mem:file_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  data:
    redis:
      repositories:
        enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

security:
  jwt:
    secret: test-only-jwt-secret-that-is-at-least-thirty-two-bytes

minio:
  endpoint: http://127.0.0.1:19000
  access-key: test-access-key
  secret-key: test-secret-key

file:
  storage:
    type: local
    local-path: ${java.io.tmpdir}/docai-file-test

logging:
  level:
    root: warn

